[project]
name = "promptops"
version = "0.1.0"
description = "Enterprise-Grade Controlled LLM Generation Platform"
authors = [{ name = "PromptOps Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "google-genai>=1.0.0",
    "jsonschema>=4.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
promptops = "promptops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
